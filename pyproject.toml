[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphallocbench"
version = "0.1.0"
description = "GraphAllocBench: A flexible benchmark suite and environment for Preference-Conditioned Multi-Objective Policy Learning."
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "GraphAllocBench Contributors"}
]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy>=1.24",
  "gymnasium>=0.29.0",
  "gym>=0.26.0",
  "stable-baselines3>=2.2.0",
  "torch>=2.2.0",
  "torch-geometric>=2.5.0",
  "pymoo>=0.6.1,<0.7",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "matplotlib>=3.7",
  "networkx>=3.1",
  "tqdm>=4.65",
  "wandb>=0.15.0",
  "pyyaml>=6.0",
  "ipykernel>=6.0",
  "plotnine>=0.12.0",
  "tensorboard>=2.14",
  "nbformat>=5.0"
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black"]

[tool.setuptools]
# Use dynamic package discovery and exclude the local models/ directory from packaging
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["graphallocbench.models*"]

[tool.setuptools.package-data]
"graphallocbench" = ["config/problems/*.yml", "config/template/*.yml"]
