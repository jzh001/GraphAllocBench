        rho: {y: 0, y_inv: 0, constant: 5}
        phi: {y: 0, y_inv: 0, constant: 0.9}
        mu: {y: 0, y_inv: 0, constant: 7}
        k: {y: 0, y_inv: 0, constant: 0.1}
