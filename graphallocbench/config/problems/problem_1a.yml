    params:
      - outer_op: max
        a: {y: 0, y_inv: 0, constant: -1.5}
        b: {y: 0, y_inv: 0, constant: 0.8}
        c: {y: 0, y_inv: 0, constant: 12}
        k: {y: 0, y_inv: 0, constant: 0}
      - outer_op: none
        rho: {y: 0, y_inv: 0, constant: 5}
        phi: {y: 0, y_inv: 0, constant: 0.1}
        mu: {y: 0, y_inv: 0, constant: 3}
        d: {y: 0, y_inv: 0, constant: 0.2}
